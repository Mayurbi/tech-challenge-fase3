# MySQL para a base de prontuários — para quem não tem MySQL instalado.
# Uso: docker compose up -d
# Credenciais casam com o DATABASE_URL padrão do .env.example.
services:
  mysql:
    image: mysql:8.4
    container_name: hospital-mco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_mco
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

volumes:
  mysql_data:
